<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Agent autonome</title>

<!-- PWA: permet "Ajouter à l'écran d'accueil" sur iPhone (plein écran, icône dédiée) -->
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Agent" />
<meta name="theme-color" content="#0f1115" />

<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #171a21;
    --sidebar: #14161c;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #8a8f9c;
    --accent: #4f8cff;
    --user-bubble: #2a3a5c;
    --assistant-bubble: #1f232c;
    --hover: #1d212b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    /* Avoid the notch / home indicator when installed full-screen on iPhone */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 8px;
  }
  #new-chat-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
  }
  #conversations {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .conv-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--muted);
  }
  .conv-item:hover { background: var(--hover); color: var(--text); }
  .conv-item.active { background: var(--hover); color: var(--text); }
  .conv-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conv-delete {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 4px;
    border-radius: 4px;
    visibility: hidden;
    flex-shrink: 0;
  }
  .conv-item:hover .conv-delete { visibility: visible; }
  .conv-delete:hover { color: #ff9b9b; }
  #empty-conversations {
    color: var(--muted);
    font-size: 13px;
    padding: 8px 10px;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    padding: 0 16px;
  }
  header {
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #log:empty::before {
    content: "Nouvelle discussion — écris ton premier message.";
    color: var(--muted);
    font-size: 14px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    white-space: pre-wrap;
    line-height: 1.45;
    font-size: 14.5px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
  }
  .msg.pending { color: var(--muted); font-style: italic; }
  .msg.error { border-color: #7a3030; color: #ff9b9b; }
  .msg img.attachment-thumb {
    display: block;
    max-width: 240px;
    max-height: 240px;
    border-radius: 8px;
    margin-bottom: 6px;
  }
  #attachment-chip {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    margin: 0 4px 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    color: var(--muted);
    width: fit-content;
  }
  #attachment-chip.visible { display: flex; }
  #attachment-remove {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
  }
  #attachment-remove:hover { color: #ff9b9b; }
  form {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 0 4px 16px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  #attach-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    width: 40px;
    height: 40px;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #attach-btn:hover { color: var(--text); }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14.5px;
    max-height: 140px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button[type="submit"] {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    height: 40px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }

  @media (max-width: 640px) {
    body { flex-direction: column; }
    #sidebar {
      width: 100%;
      max-height: 40vh;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    main { height: auto; flex: 1; }
  }
</style>
</head>
<body>
<aside id="sidebar">
  <button id="new-chat-btn" type="button">+ Nouvelle discussion</button>
  <div id="conversations"></div>
</aside>
<main>
  <header>
    <h1>Agent autonome</h1>
  </header>
  <div id="log"></div>
  <div id="attachment-chip">
    <span id="attachment-name"></span>
    <button id="attachment-remove" type="button" title="Retirer">×</button>
  </div>
  <form id="form">
    <input id="file-input" type="file" hidden
      accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.ts,.tsx,.jsx,.py,.html,.css,.yaml,.yml,.xml,.log" />
    <button id="attach-btn" type="button" title="Joindre un fichier">📎</button>
    <textarea id="input" rows="1" placeholder="Écris ta demande…" autofocus></textarea>
    <button type="submit">Envoyer</button>
  </form>
</main>
<script>
  const sidebarEl = document.getElementById("conversations");
  const newChatBtn = document.getElementById("new-chat-btn");
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const fileInput = document.getElementById("file-input");
  const attachBtn = document.getElementById("attach-btn");
  const attachmentChip = document.getElementById("attachment-chip");
  const attachmentNameEl = document.getElementById("attachment-name");
  const attachmentRemoveBtn = document.getElementById("attachment-remove");

  const MAX_ATTACHMENT_BYTES = 8 * 1024 * 1024;
  let pendingFile = null;

  let currentId = localStorage.getItem("ai-agent:lastConversation") || null;

  function setCurrentId(id) {
    currentId = id;
    if (id) localStorage.setItem("ai-agent:lastConversation", id);
    else localStorage.removeItem("ai-agent:lastConversation");
  }

  function hasVisibleContent(content) {
    if (typeof content === "string") return content.trim().length > 0;
    if (Array.isArray(content)) return content.length > 0;
    return false;
  }

  // Renders either plain text or an array of OpenAI-style content parts
  // (text / image_url) into a message bubble.
  function renderContent(el, content) {
    el.innerHTML = "";
    if (typeof content === "string") {
      el.textContent = content;
      return;
    }
    if (!Array.isArray(content)) return;
    for (const part of content) {
      if (part.type === "image_url" && part.image_url && part.image_url.url) {
        const img = document.createElement("img");
        img.className = "attachment-thumb";
        img.src = part.image_url.url;
        el.appendChild(img);
      } else if (typeof part.text === "string") {
        const div = document.createElement("div");
        div.style.whiteSpace = "pre-wrap";
        div.textContent = part.text;
        el.appendChild(div);
      }
    }
  }

  function addMessage(role, content, extraClass) {
    const el = document.createElement("div");
    el.className = "msg " + role + (extraClass ? " " + extraClass : "");
    renderContent(el, content);
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function renderSidebar() {
    const res = await fetch("/api/conversations");
    const { conversations } = await res.json();
    sidebarEl.innerHTML = "";
    if (conversations.length === 0) {
      sidebarEl.innerHTML = '<div id="empty-conversations">Aucune discussion pour l’instant.</div>';
      return;
    }
    for (const conv of conversations) {
      const item = document.createElement("div");
      item.className = "conv-item" + (conv.id === currentId ? " active" : "");
      item.innerHTML =
        '<span class="conv-title"></span><button class="conv-delete" type="button" title="Supprimer">×</button>';
      item.querySelector(".conv-title").textContent = conv.title;
      item.addEventListener("click", () => openConversation(conv.id));
      item.querySelector(".conv-delete").addEventListener("click", async (e) => {
        e.stopPropagation();
        await fetch("/api/conversations/" + encodeURIComponent(conv.id), { method: "DELETE" });
        if (conv.id === currentId) startNewConversation();
        renderSidebar();
      });
      sidebarEl.appendChild(item);
    }
  }

  async function openConversation(id) {
    setCurrentId(id);
    log.innerHTML = "";
    const res = await fetch("/api/conversations/" + encodeURIComponent(id));
    const { messages } = await res.json();
    for (const m of messages) {
      if (m.role === "user") addMessage("user", m.content);
      else if (m.role === "assistant" && hasVisibleContent(m.content)) {
        addMessage("assistant", m.content);
      }
    }
    renderSidebar();
    input.focus();
  }

  function startNewConversation() {
    setCurrentId(null);
    log.innerHTML = "";
    renderSidebar();
    input.focus();
  }

  newChatBtn.addEventListener("click", startNewConversation);

  attachBtn.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;
    if (file.size > MAX_ATTACHMENT_BYTES) {
      alert("Fichier trop volumineux (max 8 Mo).");
      fileInput.value = "";
      return;
    }
    pendingFile = file;
    attachmentNameEl.textContent = "📎 " + file.name;
    attachmentChip.classList.add("visible");
  });

  attachmentRemoveBtn.addEventListener("click", () => {
    pendingFile = null;
    fileInput.value = "";
    attachmentChip.classList.remove("visible");
  });

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    const file = pendingFile;
    if (!message && !file) return;

    if (!currentId) {
      const res = await fetch("/api/conversations", { method: "POST" });
      const { id } = await res.json();
      setCurrentId(id);
    }

    input.value = "";
    input.style.height = "auto";
    pendingFile = null;
    fileInput.value = "";
    attachmentChip.classList.remove("visible");

    const fileBase64 = file ? await fileToBase64(file) : null;

    // Local preview: full text for text/PDF files goes to the model, but
    // showing that whole blob back in the bubble would be noisy — just
    // show the filename, except images which render as an inline thumbnail.
    const previewParts = [];
    if (message) previewParts.push({ type: "text", text: message });
    if (file) {
      if (file.type.startsWith("image/")) {
        previewParts.push({ type: "image_url", image_url: { url: "data:" + file.type + ";base64," + fileBase64 } });
      } else {
        previewParts.push({ type: "text", text: "📎 " + file.name });
      }
    }
    addMessage("user", previewParts.length === 1 && previewParts[0].type === "text" ? previewParts[0].text : previewParts);

    const pending = addMessage("assistant", "…", "pending");
    input.disabled = true;
    attachBtn.disabled = true;
    form.querySelector("button[type=submit]").disabled = true;

    try {
      const payload = { conversationId: currentId, message };
      if (file) {
        payload.attachment = { name: file.name, mimeType: file.type || "application/octet-stream", dataBase64: fileBase64 };
      }
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      pending.classList.remove("pending");
      if (!res.ok) {
        pending.classList.add("error");
        pending.textContent = "Erreur : " + (data.error ?? res.status);
      } else {
        pending.textContent = data.text || "(réponse vide)";
      }
    } catch (err) {
      pending.classList.remove("pending");
      pending.classList.add("error");
      pending.textContent = "Erreur réseau : " + err.message;
    } finally {
      input.disabled = false;
      attachBtn.disabled = false;
      form.querySelector("button[type=submit]").disabled = false;
      input.focus();
      renderSidebar();
    }
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });

  (async () => {
    await renderSidebar();
    if (currentId) {
      // Verify the remembered conversation still exists before opening it.
      const res = await fetch("/api/conversations/" + encodeURIComponent(currentId));
      const { messages } = await res.json();
      if (messages.length > 0) {
        await openConversation(currentId);
        return;
      }
    }
    startNewConversation();
  })();
</script>
</body>
</html>
